<!-- Doctors Grid -->
<section class="doctors-section">
  <div class="doctors-container">
    <app-spinner *ngIf="loading" />

    <div class="doctors-grid" *ngIf="!loading && doctors.length > 0">
      <div *ngFor="let doctor of doctors" class="doctor-card" [routerLink]="['/doctors', doctor.id]">
        <div class="doctor-avatar">
          <img [src]="doctor.doctor_photo || 'assets/placeholder-doctor.png'" [alt]="doctor.fullname" />
        </div>
        <div class="doctor-info">
          <span class="doctor-specialty">{{ doctor.specializations?.[0]?.name || 'Специалист' }}</span>
          <h3 class="doctor-name">{{ doctor.fullname }}</h3>
        </div>
      </div>
    </div>

    <div *ngIf="!loading && doctors.length === 0" class="no-doctors">
      <p>Врачи не найдены</p>
    </div>
  </div>
</section>
