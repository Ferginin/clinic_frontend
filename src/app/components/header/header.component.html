<header class="header">
  <div class="header-inner">
    <!-- Logo -->
    <a routerLink="/" class="logo">
      <img src="assets/clinic-logo.png" alt="Медлайф" class="logo-img" />
    </a>

    <!-- Desktop Nav -->
    <nav class="nav-desktop">
      <a routerLink="/services" routerLinkActive="active">Услуги</a>
      <a routerLink="/doctors" routerLinkActive="active">Врачи</a>
      <a routerLink="/about" routerLinkActive="active">О клинике</a>
    </nav>

    <!-- Right side -->
    <div class="header-right">
      <a routerLink="/contacts" routerLinkActive="active" class="contacts-link">Контакты</a>

      <ng-container *ngIf="isAuthenticated">
        <a *ngIf="isAdmin" routerLink="/admin" routerLinkActive="active" class="header-btn btn-admin">Админ</a>
        <button *ngIf="isDoctor" (click)="navigateToDoctorPanel()" class="header-btn btn-primary">👨‍⚕️ Мой кабинет врача</button>
        <a *ngIf="!isAdmin && !isDoctor" routerLink="/my-appointments" class="header-btn btn-outline">Мои записи</a>
        <a routerLink="/profile" class="header-btn btn-profile">
          <span class="profile-icon">👤</span>
        </a>
        <button (click)="logout()" class="header-btn btn-logout">Выход</button>
      </ng-container>

      <ng-container *ngIf="!isAuthenticated">
        <a routerLink="/auth" class="header-btn btn-primary">Войти</a>
      </ng-container>
    </div>

    <!-- Mobile burger -->
    <button class="burger" (click)="toggleMenu()" [class.open]="menuOpen">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <!-- Mobile menu -->
  <div class="mobile-menu" *ngIf="menuOpen">
    <nav>
      <a routerLink="/services" (click)="closeMenu()">Услуги</a>
      <a routerLink="/doctors" (click)="closeMenu()">Врачи</a>
      <a routerLink="/about" (click)="closeMenu()">О клинике</a>
      <a routerLink="/contacts" (click)="closeMenu()">Контакты</a>
    </nav>
    <div class="mobile-auth">
      <ng-container *ngIf="isAuthenticated">
        <a *ngIf="isAdmin" routerLink="/admin" (click)="closeMenu()">Панель администратора</a>
        <button *ngIf="isDoctor" (click)="navigateToDoctorPanel(); closeMenu()" class="mobile-link">Мой кабинет врача</button>
        <a *ngIf="!isAdmin && !isDoctor" routerLink="/my-appointments" (click)="closeMenu()">Мои записи</a>
        <a routerLink="/profile" (click)="closeMenu()">Личный кабинет</a>
        <button (click)="logout(); closeMenu()">Выход</button>
      </ng-container>
      <ng-container *ngIf="!isAuthenticated">
        <a routerLink="/auth" (click)="closeMenu()" class="mobile-login">Войти / Регистрация</a>
      </ng-container>
    </div>
  </div>
</header>
