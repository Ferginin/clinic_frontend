<app-spinner *ngIf="loading" />

<!-- Doctor Details -->
<div *ngIf="!loading && doctor" class="doctor-details-section">
  <a routerLink="/doctors" class="back-link">← Назад к врачам</a>

  <div class="details-container">
    <!-- Left: Image -->
    <div class="doctor-image-large">
      <img [src]="doctor.doctor_photo || 'assets/placeholder-doctor.png'" [alt]="doctor.fullname" />
    </div>

    <!-- Right: Information -->
    <div class="doctor-info">
      <h1>{{ doctor.fullname }}</h1>

      <div class="specialization-badge" *ngIf="doctor.specializations?.length">
        <span *ngFor="let s of doctor.specializations">{{ s.name }}</span>
      </div>

      <!-- Description -->
      <section class="info-section" *ngIf="doctor.description">
        <h2>О враче</h2>
        <p>{{ doctor.description }}</p>
      </section>

      <!-- Schedule -->
      <section class="info-section" *ngIf="doctor.schedules?.length; else noSchedule">
        <h2>График работы</h2>
        <div class="schedule-list">
          <div *ngFor="let item of doctor.schedules" class="schedule-item">
            <span class="day">{{ dayName(item.day) }}</span>
            <span class="time">{{ formatTime(item.time_from) }} — {{ formatTime(item.time_to) }}</span>
          </div>
        </div>
      </section>

      <ng-template #noSchedule>
        <section class="info-section">
          <p class="no-data">График работы не доступен</p>
        </section>
      </ng-template>

      <!-- CTA Button -->
      <div class="cta-section">
        <button class="btn btn-primary" (click)="goToBooking()">Записаться к врачу</button>
      </div>
    </div>
  </div>
</div>
