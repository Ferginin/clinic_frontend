<div class="callback-request-modal" *ngIf="showModal">
  <div class="modal-overlay" (click)="onClose()"></div>
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Заказать обратный звонок</h2>
      <button class="close-btn" (click)="onClose()">&times;</button>
    </div>

    <form [formGroup]="callbackForm" (ngSubmit)="onSubmit()" class="callback-form">
      <div class="form-group">
        <label for="name">ФИО *</label>
        <input
          type="text"
          id="name"
          formControlName="name"
          [class.error]="name?.invalid && name?.touched"
          placeholder="Ваше ФИО">
        <div class="error-message" *ngIf="name?.invalid && name?.touched">
          <span *ngIf="name?.errors?.['required']">Имя обязательно</span>
          <span *ngIf="name?.errors?.['minlength']">Имя должно содержать минимум 2 символа</span>
        </div>
      </div>

      <div class="form-group">
        <label for="phone">Телефон *</label>
        <input
          type="tel"
          id="phone"
          formControlName="phone"
          [class.error]="phone?.invalid && phone?.touched"
          placeholder="+7 (___) ___-__-__">
        <div class="error-message" *ngIf="phone?.invalid && phone?.touched">
          <span *ngIf="phone?.errors?.['required']">Телефон обязателен</span>
          <span *ngIf="phone?.errors?.['pattern']">Неверный формат телефона</span>
        </div>
      </div>

      <div class="form-group">
        <label for="message">Сообщение</label>
        <textarea
          id="message"
          formControlName="message"
          rows="3"
          placeholder="Опишите ваш вопрос или пожелание"></textarea>
      </div>

      <label class="callback-agree">
        <input type="checkbox" formControlName="agree" />
        <span>Нажимая на кнопку вы соглашаетесь с политикой конфиденциальности</span>
      </label>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        class="submit-btn"
        [disabled]="isSubmitting || callbackForm.invalid">
        {{ isSubmitting ? 'Отправка...' : 'Отправить заявку' }}
      </button>
    </form>
  </div>
</div>

<div class="success-message" *ngIf="isSubmitted">
  <div class="success-overlay" (click)="resetForm()"></div>
  <div class="success-content" (click)="$event.stopPropagation()">
    <div class="success-icon">✓</div>
    <h3>Заявка отправлена!</h3>
    <p>Мы свяжемся с вами в ближайшее время.</p>
    <button class="ok-btn" (click)="resetForm()">Хорошо</button>
  </div>
</div>
